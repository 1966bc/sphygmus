; sphygmus - where things are. Nothing about the readings lives here: the
; threshold and the name on the report are rows in the diary.

[database]
; The diary, relative to the program folder unless the path is absolute.
; The file is created, empty, the first time the program starts.
path = sphygmus.sl3

[window]
; A ttk theme. 'clam' looks the same on Linux and on Windows.
theme = clam
